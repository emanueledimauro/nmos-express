<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title data-i18n="page_title">Matrice de Commutation Groupée</title>

	<script>
		tailwind = { config: {} };
	</script>
	<script src="lib/js/tailwind.js"></script>
	<script src="lib/js/jquery/jquery.min.js"></script>


	<!-- Font Awesome local (offline) -->
	<link href="lib/css/fontawesome/css/all.min.css" rel="stylesheet">

	<link rel="stylesheet" href="lib/css/index.css?v=1.0">

	<script src="lib/js/i18n.js"></script>
	<script src="lib/js/modal.js?v=1.0"></script>
	<script src="lib/js/menu.js?v=1.0"></script>
	<link rel="stylesheet" href="lib/css/modal.css?v=1.0">
</head>

<body class="bg-gray-50 text-gray-800 h-screen flex flex-col p-6 font-sans">

	<header class="mb-4 flex justify-between items-center max-w-[100%] mx-auto w-full">
		<div>
			<h1 class="text-xl font-bold text-gray-900">
				<!--<i class="fas fa-layer-group mr-2 text-blue-600"></i>Matrice Groupée-->
				<img src="images/logo-grid.png" style="height:50px">
			</h1>
		</div>

		<div class="text-right text-xs text-gray-400 flex flex-col items-end gap-1">
			<div class="flex items-center gap-1 relative">



				<!--<label for="mediaSelect">Média :</label>-->
				&nbsp;&nbsp;


				<select id="mediaSelect" class="mini-input !w-auto !py-1 !text-xs" onchange="changeType();">
					<option value="video" selected data-i18n="video">Vidéo</option>
					<option value="audio" data-i18n="audio">Audio</option>
					<option value="data" data-i18n="data">Data</option>
					<option value="virtual" data-i18n="virtual">Virtual</option>
				</select>
				&nbsp;&nbsp;




				<button id="updateBtn"
					class="ml-2 px-2 py-1 bg-blue-600 text-white rounded text-[11px] hover:bg-blue-700 flex items-center gap-1">
					<i id="updateIcon" class="fas fa-sync-alt"></i>
					<span id="updateText" data-i18n="nmos_update"></span>
				</button>

				<div id="menuContainer" class="relative"></div>

			</div>
			<!--
            <label class="flex items-center gap-1 text-[10px] text-gray-500">
                
            </label>
            <label class="flex items-center gap-1 text-[10px] text-gray-500">
               
            </label>
			-->
		</div>
	</header>


	<!-- Toolbar Workflow -->
	<div class="mb-4 bg-white border border-gray-200 rounded-lg shadow-sm p-2 flex flex-wrap items-center gap-3">
		<!-- Actions -->
		<div class="flex items-center gap-1">
			<button id="btnOpenGroups"
				class="px-2 h-8 flex items-center gap-2 text-gray-700 hover:text-blue-600 hover:bg-blue-50 rounded-md transition-colors text-xs"
				title="Ouvrir les groupes" data-i18n-title="open_group" onclick="expandAllGroups();">
				<i class="fas fa-folder-open text-xs"></i><span data-i18n="open_group"></span>
			</button>

			<button id="btnCloseGroups"
				class="hidden px-2 h-8 flex items-center gap-2 text-gray-700 hover:text-blue-600 hover:bg-blue-50 rounded-md transition-colors text-xs"
				title="Fermer les groupes" data-i18n-title="close_group" onclick="collapseAllGroups();">
				<i class="fas fa-folder-closed text-xs"></i><span data-i18n="close_group"></span>
			</button>

			<div id="selectionOptions" class="flex items-center gap-1 text-xs ml-auto"
				style="margin-top:7px; margin-bottom:7px; margin-right:7px;">
				&nbsp;<input id="toggleLabs" type="checkbox" checked>&nbsp; <div data-i18n="only_custom_labs"></div>
				&nbsp;<input id="toggleActive" type="checkbox" checked>&nbsp; <div data-i18n="only_active"></div>
			</div>

		</div>



		<div class="flex items-center gap-1 text-xs ml-auto"
			style="margin-top:7px; margin-bottom:7px; margin-right:7px;">
			<button id="snapshotSalvoBtn" type="button" onclick="openSalvoSnapshotModal()"
				class="px-2.5 py-1 bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white rounded text-xs font-medium flex items-center gap-1.5 shadow-sm transition-colors"
				title="Enregistrer l'état de commutation sous forme de salvo"
				data-i18n-title="snapshot_salvo_btn_title">
				<i class="fas fa-camera text-xs"></i>
				<span data-i18n="snapshot_salvo_btn">Salvo</span>
			</button>
		</div>

	</div>



	<div class="matrix-container shadow flex-grow bg-white mx-auto">

		<table id="matrixTable"></table>
		<div id="emptyHint" class="empty-hint hidden"></div>
	</div>

	<div class="fixed bottom-0 inset-x-0 z-50 mt-2 bg-gray-900 text-green-400 p-2 rounded-md shadow font-mono text-[10px] h-24 overflow-y-auto leading-tight max-w-[100%] mx-auto w-full"
		status="close" id="consoleLog" style="height: 40px;">
		<div class="border-b border-gray-700 pb-1 mb-1 text-gray-1000"><button onclick="toogleLog()"><i id="zoomLog"
					class="fa fa-expand" style="font-size:14px;color:#FFFFFF"></i></button> &nbsp;>> <span
				data-i18n="system_logs">SYSTEM LOGS</span> </div>
	</div>

	<script src="lib/js/index.js?v=1.1"></script>
	<BR>
	<!-- Modal Snapshot Salvo -->
	<div id="salvoSnapshotModal"
		class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm transition-opacity duration-200">
		<div class="bg-white rounded-xl shadow-2xl border border-gray-200 max-w-md w-full overflow-hidden flex flex-col max-h-[90vh]"
			onclick="event.stopPropagation()">

			<!-- Header -->
			<div
				class="px-5 py-3.5 bg-gradient-to-r from-amber-500 to-amber-600 text-white flex items-center justify-between">
				<div class="flex items-center gap-2">
					<i class="fas fa-camera text-base"></i>
					<h3 class="font-bold text-sm tracking-wide" data-i18n="snapshot_modal_title">Enregistrer l'état de
						commutation</h3>
				</div>
				<button type="button" onclick="closeSalvoSnapshotModal()"
					class="text-white/80 hover:text-white w-7 h-7 flex items-center justify-center rounded-full hover:bg-black/10 transition-colors">
					<i class="fas fa-times text-sm"></i>
				</button>
			</div>

			<!-- Body -->
			<div class="p-5 space-y-4 overflow-y-auto text-xs text-gray-700">

				<!-- Salvo Name Input -->
				<div>
					<label class="block font-semibold text-gray-700 mb-1" data-i18n="snapshot_name_label">Nom du salvo /
						workflow</label>
					<input type="text" id="snapshotSalvoName" class="mini-input !w-full !py-1.5 !text-xs font-medium"
						placeholder="Ex: Direct PGM, Plateau 1 matin..."
						data-i18n-placeholder="snapshot_name_placeholder">
				</div>

				<!-- Scope Preview: Open Categories -->
				<div class="space-y-3 bg-gray-50 p-3 rounded-lg border border-gray-200">
					<!-- Sources ouvertes -->
					<div>
						<div class="text-[11px] font-semibold text-blue-900 mb-1.5 flex items-center gap-1.5">
							<i class="fas fa-arrow-right-from-bracket text-blue-600"></i>
							<span data-i18n="snapshot_open_sources">Catégories sources ouvertes :</span>
						</div>
						<div id="snapshotOpenSourcesList" class="flex flex-wrap gap-1.5 min-h-[22px]">
							<!-- Badges injected dynamically by JS -->
						</div>
					</div>

					<!-- Destinations ouvertes -->
					<div>
						<div class="text-[11px] font-semibold text-purple-900 mb-1.5 flex items-center gap-1.5">
							<i class="fas fa-arrow-right-to-bracket text-purple-600"></i>
							<span data-i18n="snapshot_open_destinations">Catégories destinations ouvertes :</span>
						</div>
						<div id="snapshotOpenDestsList" class="flex flex-wrap gap-1.5 min-h-[22px]">
							<!-- Badges injected dynamically by JS -->
						</div>
					</div>
				</div>

				<!-- Dynamic Route Count Badge / Alert -->
				<div id="snapshotCountBadge"
					class="p-2.5 rounded-lg border flex items-center gap-2 font-medium transition-colors">
					<i id="snapshotCountIcon" class="fas fa-info-circle"></i>
					<span id="snapshotCountText">0 commutation(s) active(s) entre les catégories ouvertes</span>
				</div>

			</div>

			<!-- Footer Actions -->
			<div class="px-5 py-3 bg-gray-50 border-t border-gray-200 flex items-center justify-end gap-2">
				<button type="button" onclick="closeSalvoSnapshotModal()"
					class="px-4 py-1.5 bg-white border border-gray-300 text-gray-700 rounded-md hover:bg-gray-100 font-medium text-xs transition-colors"
					data-i18n="snapshot_cancel_btn">
					Annuler
				</button>
				<button type="button" id="snapshotSaveBtn" onclick="saveSalvoSnapshot()"
					class="px-4 py-1.5 bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white rounded-md font-medium text-xs flex items-center gap-1.5 shadow-sm transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
					<i class="fas fa-save"></i>
					<span data-i18n="snapshot_save_btn">Enregistrer le salvo</span>
				</button>
			</div>

		</div>
	</div>

</body>

</html>
