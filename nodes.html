<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="nodes_page_title">NMOS Nodes Management</title>

    <script>
        tailwind = { config: {} };
    </script>
    <script src="lib/js/tailwind.js"></script>
    <script src="lib/js/jquery/jquery.min.js"></script>

    <!-- Font Awesome local (offline) -->
    <link href="lib/css/fontawesome/css/all.min.css" rel="stylesheet">
    <link href="lib/css/tailwind.css" rel="stylesheet">

    <link rel="stylesheet" href="lib/css/nodes.css?v=1.0">

    <script src="lib/js/i18n.js"></script>
    <script src="lib/js/modal.js?v=1.0"></script>
	<script src="lib/js/menu.js?v=1.0"></script>
    <link rel="stylesheet" href="lib/css/modal.css?v=1.0">
</head>

<body class="bg-gray-50 text-gray-800 h-screen flex flex-col p-6 font-sans">

    <!-- HEADER (Copied structure from nmos_graph.html) -->
    <header class="mb-4 flex justify-between items-center max-w-[100%] mx-auto w-full">
        <div>
            <h1 class="text-xl font-bold text-gray-900">
                <img src="images/logo-nodes.png" style="height:45px" onerror="this.src='images/logo-graph.png'">
            </h1>
        </div>

        <div class="text-right text-xs text-gray-400 flex flex-col items-end gap-1">
            <div class="flex items-center gap-2 relative">

                <div id="menuContainer" class="relative"></div>



            </div>
        </div>
    </header>

    


    <!-- Main Content -->
    <div class="flex-grow bg-white rounded-lg shadow border border-gray-200 p-6 overflow-auto">

        <div class="flex justify-between items-center mb-6">
            <h2 class="text-lg font-semibold text-gray-700" data-i18n="nodes_config_title">Configuration des Noeuds NMOS
            </h2>
            <button id="addNodeBtn" onclick="openAddNodeModal()"
                class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 text-sm font-medium flex items-center gap-2">
                <i class="fas fa-plus"></i> <span data-i18n="nodes_add_btn">Ajouter un noeud</span>
            </button>
        </div>

        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-gray-50 border-b border-gray-200 text-xs text-gray-500 uppercase tracking-wider">
                    <th class="p-4 w-24 text-center font-medium">
                        <div class="inline-flex items-center justify-center gap-1.5">
                            <span data-i18n="nodes_col_status">État</span>
                            <button type="button" id="refreshStatusBtn" onclick="checkAllNodesStatus(true)"
                                class="text-gray-400 hover:text-blue-600 p-1 rounded hover:bg-gray-200 transition-colors focus:outline-none"
                                title="Actualiser l'état" data-i18n-title="nodes_refresh_status_title">
                                <i id="refreshStatusIcon" class="fas fa-sync-alt text-[11px]"></i>
                            </button>
                        </div>
                    </th>
                    <th class="p-4 font-medium" data-i18n="nodes_col_name">Nom du Noeud</th>
                    <th class="p-4 font-medium" data-i18n="nodes_col_url">URL de l'API</th>
                    <th class="p-4 font-medium text-right" data-i18n="nodes_col_actions">Actions</th>
                </tr>
            </thead>
            <tbody id="nodesTableBody" class="divide-y divide-gray-100 text-sm text-gray-700">
                <!-- Rows will be injected here -->
            </tbody>
        </table>

        <div class="mt-6 flex justify-end gap-3">
            <button id="addManualNodeBtn" onclick="addNodeRow()"
                class="px-5 py-2 bg-gray-600 text-white rounded hover:bg-gray-700 font-medium flex items-center gap-2 shadow-sm">
                <i class="fas fa-plus"></i> <span data-i18n="nodes_add_manual_btn">Ajouter un noeud manuellement</span>
            </button>
            <button id="updateBaseBtn" onclick="updateNmosDatabase()"
                class="px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 font-medium flex items-center gap-2 shadow-sm transition-all"
                title="Enregistre la liste des nœuds et synchronise la base NMOS (met à jour les nœuds actifs et purge les nœuds supprimés)">
                <i id="updateBaseIcon" class="fas fa-sync-alt"></i>
                <span id="updateBaseText" data-i18n="nodes_update_base_btn">Mettre à jour la base NMOS</span>
            </button>
        </div>

    </div>

    <!-- Modal d'ajout d'équipement NMOS -->
    <div id="addNodeModal"
        class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl border border-gray-200 w-full max-w-md overflow-hidden">
            <div class="px-6 py-4 bg-gray-50 border-b border-gray-200 flex justify-between items-center">
                <h3 class="text-base font-semibold text-gray-800" data-i18n="nodes_modal_title">Ajouter un équipement
                    NMOS</h3>
                <button onclick="closeAddNodeModal()" class="text-gray-400 hover:text-gray-600 focus:outline-none">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="p-6 space-y-4 text-sm">
                <div>
                    <label class="block text-xs font-medium text-gray-600 uppercase mb-1"
                        data-i18n="nodes_modal_name">Nom de l'équipement</label>
                    <input type="text" id="modalNodeName" class="mini-input" placeholder="Nom (ex: SNP)"
                        data-i18n-placeholder="nodes_placeholder_name">
                </div>

                <div class="grid grid-cols-12 gap-3 items-end">
                    <div class="col-span-6">
                        <label class="block text-xs font-medium text-gray-600 uppercase mb-1"
                            data-i18n="nodes_modal_ip">Adresse IP</label>
                        <input type="text" id="modalNodeIp" oninput="onIpPortInput()" class="mini-input"
                            placeholder="172.18.5.1">
                    </div>
                    <div class="col-span-3">
                        <label class="block text-xs font-medium text-gray-600 uppercase mb-1"
                            data-i18n="nodes_modal_port">Port</label>
                        <input type="text" id="modalNodePort" oninput="onIpPortInput()" class="mini-input"
                            placeholder="8100" data-i18n-placeholder="nodes_modal_port_placeholder">
                    </div>
                    <div class="col-span-3">
                        <button type="button" id="discoverVersionsBtn" onclick="discoverNodeVersions()"
                            class="w-full py-1.5 px-2 bg-gray-100 hover:bg-gray-200 text-gray-700 border border-gray-300 rounded text-xs font-medium flex items-center justify-center gap-1 transition-colors">
                            <i id="discoverSpinner" class="fas fa-sync-alt"></i>
                            <span data-i18n="nodes_modal_fetch_versions">Détecter</span>
                        </button>
                    </div>
                </div>

                <div id="modalDiscoverStatus" class="text-xs hidden"></div>

                <div>
                    <label class="block text-xs font-medium text-gray-600 uppercase mb-1"
                        data-i18n="nodes_modal_version">Version IS-04</label>
                    <select id="modalNodeVersion" onchange="updateModalPreview()" disabled
                        class="mini-input bg-white disabled:bg-gray-100 disabled:text-gray-400 cursor-pointer">
                        <option value="" data-i18n="nodes_modal_version_placeholder">-- Interroger l'équipement --
                        </option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-500 uppercase mb-1"
                        data-i18n="nodes_modal_preview">URL générée</label>
                    <input type="text" id="modalUrlPreview" readonly
                        class="mini-input bg-gray-100 text-gray-600 font-mono text-xs cursor-not-allowed" value="">
                </div>
            </div>

            <div class="px-6 py-3 bg-gray-50 border-t border-gray-200 flex justify-end gap-2">
                <button type="button" onclick="closeAddNodeModal()"
                    class="px-4 py-1.5 bg-white border border-gray-300 text-gray-700 rounded hover:bg-gray-100 text-sm font-medium"
                    data-i18n="nodes_modal_cancel">Annuler</button>
                <button type="button" id="modalOkBtn" onclick="confirmAddNode()" disabled
                    class="px-5 py-1.5 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed text-sm font-medium"
                    data-i18n="nodes_modal_ok">OK</button>
            </div>
        </div>
    </div>

    <script src="lib/js/nodes.js?v=1.1"></script>
    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>
</body>

</html>
